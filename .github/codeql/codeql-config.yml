# CodeQL configuration for Budget-AI
# This configuration specifies which paths to include/exclude for each language

name: "Budget-AI CodeQL Config"

# Paths to include in the analysis
paths:
  # Python paths (backend and worker)
  - backend/
  - worker/
  # Swift paths (iOS app)
  - BudgetAI/
  - BudgetAITests/
  - BudgetAIUITests/
  # JavaScript/TypeScript paths (web frontend)
  - web/

# Paths to exclude from analysis
paths-ignore:
  # Build and generated files
  - '**/node_modules/**'
  - '**/build/**'
  - '**/dist/**'
  - '**/.venv/**'
  - '**/__pycache__/**'
  - '**/venv/**'
  - '**/.pytest_cache/**'
  # Dependencies and external code
  - '**/vendor/**'
  - '**/Pods/**'
  # Test data and fixtures
  - '**/test_data/**'
  - '**/fixtures/**'
  # Documentation
  - 'docs/**'
  - '**/*.md'
  # Config files
  - '**/*.json'
  - '**/*.yml'
  - '**/*.yaml'
  # Database migrations (SQL)
  - 'db/migrations/**'

# Query configuration
queries:
  - uses: security-extended
  - uses: security-and-quality
