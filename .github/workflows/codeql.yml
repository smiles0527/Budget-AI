# ⚠️ CRITICAL: This workflow CANNOT run until default CodeQL setup is disabled
# 
# ERROR: "CodeQL analyses from advanced configurations cannot be processed 
#         when the default setup is enabled"
#
# REQUIRED ACTION (Repository Owner):
# 1. Go to: Settings → Security → Code security and analysis
# 2. Find "CodeQL analysis" with "Default" label
# 3. Click "..." menu → "Switch to advanced"
# 4. See .github/CODEQL_SETUP.md for detailed instructions
#
# This workflow is correctly configured but GitHub blocks it when default 
# setup is enabled. This is a repository setting that must be changed.

name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays at midnight UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Python analysis for backend and worker
          - language: python
            os: ubuntu-latest
            timeout: 360
            build-mode: none
          # Swift analysis for iOS app
          - language: swift
            os: macos-latest
            timeout: 360
            build-mode: manual
          # JavaScript/TypeScript analysis for web frontend
          - language: javascript-typescript
            os: ubuntu-latest
            timeout: 360
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended,security-and-quality

    # For Swift, we need to build the project
    - name: Build Swift project
      if: matrix.language == 'swift'
      run: |
        xcodebuild -project BudgetAI.xcodeproj -scheme BudgetAI -destination 'generic/platform=iOS Simulator' clean build CODE_SIGNING_ALLOWED=NO

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
