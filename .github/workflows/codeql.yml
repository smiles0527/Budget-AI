# This is a sample CodeQL configuration file
name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up CodeQL
        uses: github/codeql-action/setup@v1
        with:
          languages: python
      - name: Auto-analyze
        uses: github/codeql-action/autobuild@v1
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v1
